name: Build global fiber and electric v2 fallback release

on:
  push:
    branches:
      - build/global-infrastructure-v2-20260828
    paths:
      - ".github/workflows/build-global-infrastructure-v2-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: "1"
      V2_BUILD_ROOT: build/global_infrastructure_v2_fallback
      MVT_ZOOM: "5"
      MVT_WORKERS: "12"
      ARCGIS_MAX_ITEMS: "120"
      ARCGIS_MAX_LAYERS: "60"
      ARCGIS_MAX_PER_LAYER: "10000"
      ARCGIS_MAX_TOTAL: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install requests urllib3 lxml mapbox-vector-tile gdown
      - name: Build bounded v2 fallback
        run: python tools/global_infrastructure_v2/build_global_infrastructure_v2.py
      - name: Validate bounded v2 fallback
        run: |
          set -euo pipefail
          OUT=build/global_infrastructure_v2_fallback/out
          test -s "$OUT/global_fiber_electric_v2_broad_research_2026-08-28.kmz"
          test -s "$OUT/global_fiber_electric_v2_download_bundle_FIXED_2026-08-28.zip"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('build/global_infrastructure_v2_fallback/out/global_fiber_electric_v2_validation.json')
          d=json.loads(p.read_text())
          print(json.dumps(d, indent=2))
          if d.get('status') != 'pass':
              raise SystemExit('fallback release gates did not pass')
          PY
      - name: Upload bounded v2 fallback
        uses: actions/upload-artifact@v4
        with:
          name: global-fiber-electric-v2-fallback-2026-08-28
          path: build/global_infrastructure_v2_fallback/out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

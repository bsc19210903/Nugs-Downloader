name: Test private source access for global infrastructure v2

on:
  push:
    branches:
      - build/global-infrastructure-v2-20260828
    paths:
      - ".github/workflows/test-global-infrastructure-v2-cross-repo.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test scoped token against private source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/bsc19210903/mapforge/contents/research/global-infrastructure-v2/build_global_infrastructure_v2.py?ref=research/global-infrastructure-kml-v2-20260827")
          echo "$code" > status.txt
          cat response.json | head -c 1000 > response-head.txt
          test "$code" = "200"
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-infrastructure-v2-cross-repo-test
          path: |
            status.txt
            response-head.txt

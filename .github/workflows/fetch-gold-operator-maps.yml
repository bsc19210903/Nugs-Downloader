name: Fetch gold operator map sources

on:
  push:
    branches:
      - build/global-infrastructure-v2-20260828
    paths:
      - ".github/workflows/fetch-gold-operator-maps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install XML recovery dependency
        run: python -m pip install lxml

      - name: Download public operator maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p operator-maps/bluebird
          curl --fail --location --retry 5 --retry-all-errors \
            -o operator-maps/Viaero-Fiber-routes-2026-02-12.kml \
            'https://viaerofiber.com/hubfs/vfn_routes_12Feb2026.kml?hsLang=en'
          curl --fail --location --retry 5 --retry-all-errors \
            -o operator-maps/Bluebird-Public-Network-Q1-2026.zip \
            'https://bluebirdfiber.com/wp-content/uploads/2026/03/BBF-Public-Network-Q12026.kmz_.zip'
          unzip -q operator-maps/Bluebird-Public-Network-Q1-2026.zip -d operator-maps/bluebird
          find operator-maps -maxdepth 3 -type f -printf '%12s  %p\n' | sort -n

      - name: Validate and normalize KML/KMZ contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil, tempfile, zipfile
          from lxml import etree

          root = Path('operator-maps')
          parser = etree.XMLParser(huge_tree=True, recover=True)
          report = []

          viaero = root / 'Viaero-Fiber-routes-2026-02-12.kml'
          viaero_root = etree.parse(str(viaero), parser)
          viaero_root.write(str(root / 'Viaero-Fiber-routes-2026-02-12.normalized.kml'), encoding='UTF-8', xml_declaration=True)
          report.append({'file': str(viaero), 'recoverable': True, 'normalized': True})

          candidates = [p for p in (root / 'bluebird').rglob('*.kmz') if '__MACOSX' not in p.parts and not p.name.startswith('._')]
          if not candidates:
              raise SystemExit('Bluebird archive contained no usable KMZ')
          for path in candidates:
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f'Corrupt Bluebird member: {bad}')
                  kmls = [n for n in archive.namelist() if n.lower().endswith('.kml') and '__MACOSX' not in n and not Path(n).name.startswith('._')]
                  if not kmls:
                      raise SystemExit(f'No KML in {path}')
                  with tempfile.TemporaryDirectory() as td:
                      td = Path(td)
                      archive.extractall(td)
                      for name in kmls:
                          source = td / name
                          tree = etree.parse(str(source), parser)
                          normalized = source.with_name(source.stem + '.normalized.kml')
                          tree.write(str(normalized), encoding='UTF-8', xml_declaration=True)
                          shutil.copy2(normalized, root / 'bluebird' / 'Bluebird-Public-Network-Q1-2026.normalized.kml')
                          report.append({'file': str(path), 'member': name, 'recoverable': True, 'normalized': True})
                          break
          (root / 'VALIDATION_REPORT.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Record provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'accessed_utc='$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo 'viaero_source=https://viaerofiber.com/network/map'
            echo 'viaero_download=https://viaerofiber.com/hubfs/vfn_routes_12Feb2026.kml?hsLang=en'
            echo 'bluebird_source=https://bluebirdfiber.com/our-network/'
            echo 'bluebird_download=https://bluebirdfiber.com/wp-content/uploads/2026/03/BBF-Public-Network-Q12026.kmz_.zip'
            find operator-maps -type f -not -path '*/__MACOSX/*' -print0 | sort -z | xargs -0 sha256sum
          } > operator-maps/SOURCE_RECEIPT.txt

      - name: Upload operator sources
        uses: actions/upload-artifact@v4
        with:
          name: gold-public-operator-maps-2026-09-08
          path: operator-maps
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

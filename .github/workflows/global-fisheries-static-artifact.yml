name: Build global fisheries static artifact

on:
  push:
    branches:
      - codex/global-fisheries-static-artifact-20260828
    paths:
      - tools/global_static/**
      - .github/workflows/global-fisheries-static-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests lxml
      - name: Restore and verify converter payloads
        run: |
          set -euo pipefail
          mkdir -p /tmp/global-static
          cat tools/global_static/build_remote_static.py.gz.part* > /tmp/global-static/build_remote_static.py.gz
          cat tools/global_static/live_sources.json.gz.part* > /tmp/global-static/live_sources.json.gz
          echo 'e8f0f1e7e409a507e42d2731e19ad45badc84e5ee32e3b75a8ffb0d90df49fdb  /tmp/global-static/build_remote_static.py.gz' | sha256sum -c --strict
          echo '96a16f38fb52ac2352e262b2406b14fc06db31cc0cb01fb266d5667acd2819e6  /tmp/global-static/live_sources.json.gz' | sha256sum -c --strict
          gzip -dc /tmp/global-static/build_remote_static.py.gz > /tmp/global-static/build_remote_static.py
          gzip -dc /tmp/global-static/live_sources.json.gz > /tmp/global-static/live_sources.json
          python -m py_compile /tmp/global-static/build_remote_static.py
          python -m json.tool /tmp/global-static/live_sources.json >/dev/null
      - name: Parallelize the verified collector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/global-static/build_remote_static.py')
          t=p.read_text()
          t=t.replace('from __future__ import annotations\n', 'from __future__ import annotations\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\n')
          t=t.replace('ap=argparse.ArgumentParser(); ap.add_argument("--sources",type=Path,required=True); ap.add_argument("--out",type=Path,required=True); args=ap.parse_args()', 'ap=argparse.ArgumentParser(); ap.add_argument("--sources",type=Path,required=True); ap.add_argument("--out",type=Path,required=True); ap.add_argument("--workers",type=int,default=10); args=ap.parse_args()')
          old='''    s=session(); folders=[]; ledgers=[]
    for i,source in enumerate(sources,1):
        print(f"[{i}/{len(sources)}] {source['id']} — {source['title']}",flush=True)
        folder,ledger=process_source(s,source); ledgers.append(ledger)
        if folder is not None: folders.append((source,folder))
'''
          new='''    folders=[]; ledgers=[]
    def one(index_source):
        i, source = index_source
        print(f"[{i}/{len(sources)}] START {source['id']} — {source['title']}",flush=True)
        folder, ledger = process_source(session(), source)
        print(f"[{i}/{len(sources)}] DONE {source['id']} status={ledger['status']} features={ledger['features_embedded']}",flush=True)
        return i, source, folder, ledger
    completed=[]
    with ThreadPoolExecutor(max_workers=max(1,args.workers)) as pool:
        futures=[pool.submit(one,x) for x in enumerate(sources,1)]
        for future in as_completed(futures):
            completed.append(future.result())
    completed.sort(key=lambda x:x[0])
    for _,source,folder,ledger in completed:
        ledgers.append(ledger)
        if folder is not None: folders.append((source,folder))
'''
          if old not in t:
              raise SystemExit('collector loop patch target not found')
          t=t.replace(old,new)
          p.write_text(t)
          PY
          python -m py_compile /tmp/global-static/build_remote_static.py
      - name: Acquire and embed all live source geometry
        run: |
          python /tmp/global-static/build_remote_static.py \
            --sources /tmp/global-static/live_sources.json \
            --out dist \
            --workers 10
      - name: Verify static artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('dist/global_remote_static_validation.json').read_text())
          assert v['xml_parse_ok']
          assert v['networklinks_zero']
          assert v['coordinates_valid']
          assert v['placemarks'] > 0
          print(json.dumps(v,indent=2))
          PY
      - name: Upload KML/KMZ and audit ledger
        uses: actions/upload-artifact@v4
        with:
          name: global-fisheries-remote-static
          path: dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

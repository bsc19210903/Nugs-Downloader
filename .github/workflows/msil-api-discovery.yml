name: Discover Japan MSIL public GIS APIs

on:
  push:
    branches:
      - codex/global-fisheries-static-artifact-20260828
    paths:
      - .github/workflows/msil-api-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Enumerate API catalogue and network responses
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              seen=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page()
                  page.on('response',lambda r: seen.append(r.url))
                  for url in ['https://portal.msil.go.jp/apis','https://portal.msil.go.jp/api-details']:
                      try:
                          await page.goto(url,wait_until='networkidle',timeout=120000)
                          await page.wait_for_timeout(5000)
                      except Exception as e:
                          seen.append('ERROR '+url+' '+repr(e))
                  html=await page.content()
                  text=await page.locator('body').inner_text()
                  await browser.close()
              candidates=sorted(set(x for x in seen if re.search(r'api|swagger|openapi|msil|catalog',x,re.I)))
              endpoints=sorted(set(re.findall(r'https?://[^\s"<>]+',html+'\n'+text+'\n'+'\n'.join(seen))))
              interesting=[x for x in endpoints if re.search(r'fish|right|wind|cable|gyog|漁業|風力|MapServer|FeatureServer',x,re.I)]
              out={'network_urls':candidates,'interesting_endpoints':interesting,'body_text':text,'html':html}
              Path('msil-discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: msil-api-discovery
          path: msil-discovery.json
          retention-days: 3

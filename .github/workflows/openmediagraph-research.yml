name: OpenMediaGraph read-only research

on:
  pull_request:
    paths:
      - "research/openmediagraph_next5/**"
      - ".github/workflows/openmediagraph-research.yml"

permissions:
  contents: read

concurrency:
  group: openmediagraph-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  next-five-canary:
    name: Execute five read-only research steps
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=2.1,<3" \
            "scipy>=1.14,<2" \
            "psutil>=6,<8" \
            "huggingface_hub>=0.36,<2" \
            "hf_xet>=1.1,<2"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "torch==2.7.1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Run focused harness tests
        run: python research/openmediagraph_next5/run_bundle.py --self-test

      - name: Execute five research steps
        run: |
          python research/openmediagraph_next5/run_bundle.py \
            --work "${RUNNER_TEMP}/openmediagraph-work" \
            --output "openmediagraph-results"

      - name: Run rigorous Xet endpoint and chunk-cache follow-up
        env:
          HF_HOME: ${{ runner.temp }}/omg-xet/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/omg-xet/hub-cache
          HF_XET_CACHE: ${{ runner.temp }}/omg-xet/xet-cache
          HF_XET_LOG_DEST: ${{ runner.temp }}/omg-xet/xet-logs/
          HF_XET_LOG_FORMAT: json
          HF_XET_LOG_DIR_DISABLE_CLEANUP: "1"
          HF_XET_CHUNK_CACHE_SIZE_BYTES: "1000000000"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          RUST_LOG: info
        run: |
          mkdir -p "${HF_HUB_CACHE}" "${HF_XET_CACHE}" "${HF_XET_LOG_DEST}" openmediagraph-results/step2
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import time
          from pathlib import Path

          import hf_xet
          import psutil
          from huggingface_hub import HfApi, hf_hub_download

          repo_id = "hf-internal-testing/librispeech_asr_dummy"
          filename = "clean/validation-00000-of-00001.parquet"
          revision = "5be91486e11a2d616f4ec5db8d3fd248585ac07a"
          hub_cache = Path(os.environ["HF_HUB_CACHE"])
          xet_cache = Path(os.environ["HF_XET_CACHE"])
          log_dir = Path(os.environ["HF_XET_LOG_DEST"])
          output = Path("openmediagraph-results/step2/XET_FOLLOWUP.json")

          def tree_stats(root: Path) -> dict[str, int]:
              files = [path for path in root.rglob("*") if path.is_file()] if root.exists() else []
              return {
                  "files": len(files),
                  "bytes": sum(path.stat().st_size for path in files),
              }

          def log_stats() -> dict[str, object]:
              files = [path for path in log_dir.rglob("*") if path.is_file()] if log_dir.exists() else []
              text = "\n".join(
                  path.read_text(encoding="utf-8", errors="replace") for path in files
              )
              lowered = text.lower()
              patterns = {
                  key: lowered.count(key)
                  for key in (
                      "xet",
                      "cas",
                      "xorb",
                      "range",
                      "chunk",
                      "reconstruction",
                      "cache",
                  )
              }
              return {
                  "files": len(files),
                  "bytes": sum(path.stat().st_size for path in files),
                  "patterns": patterns,
              }

          def download(label: str) -> dict[str, object]:
              before = psutil.net_io_counters()
              started = time.perf_counter()
              path = Path(
                  hf_hub_download(
                      repo_id=repo_id,
                      filename=filename,
                      repo_type="dataset",
                      revision=revision,
                      cache_dir=hub_cache,
                  )
              )
              elapsed = time.perf_counter() - started
              after = psutil.net_io_counters()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              return {
                  "label": label,
                  "elapsed_seconds": elapsed,
                  "payload_bytes": path.stat().st_size,
                  "sha256": digest,
                  "network_received_delta": after.bytes_recv - before.bytes_recv,
                  "network_sent_delta": after.bytes_sent - before.bytes_sent,
                  "hub_cache": tree_stats(hub_cache),
                  "xet_cache": tree_stats(xet_cache),
                  "xet_logs": log_stats(),
              }

          info = HfApi().dataset_info(
              repo_id,
              revision=revision,
              files_metadata=True,
          )
          sibling = next(item for item in info.siblings if item.rfilename == filename)
          xet_metadata = getattr(sibling, "xet_file_data", None)
          xet_file_hash = None
          if isinstance(xet_metadata, dict):
              xet_file_hash = xet_metadata.get("file_hash")
          elif xet_metadata is not None:
              xet_file_hash = getattr(xet_metadata, "file_hash", None)

          cold_a = download("cold_a_empty_hub_and_xet_cache")
          warm = download("warm_same_hub_cache")

          # Force reconstruction again while preserving only the Xet chunk cache.
          shutil.rmtree(hub_cache)
          hub_cache.mkdir(parents=True, exist_ok=True)
          cold_b = download("cold_b_empty_hub_preserved_xet_cache")

          hashes_equal = len(
              {cold_a["sha256"], warm["sha256"], cold_b["sha256"]}
          ) == 1
          patterns = cold_b["xet_logs"]["patterns"]
          endpoint_evidence = any(
              patterns[key] > 0
              for key in ("cas", "xorb", "range", "reconstruction")
          )
          network_ratio = cold_b["network_received_delta"] / max(
              cold_a["network_received_delta"], 1
          )
          chunk_cache_reuse_observed = (
              cold_a["xet_cache"]["bytes"] > 0
              or cold_b["xet_cache"]["bytes"] > 0
          ) and network_ratio < 0.9
          result = {
              "schema_version": "openmediagraph.xet-followup.v2",
              "status": "completed_with_negative_chunk_cache_result",
              "repository": repo_id,
              "revision": revision,
              "filename": filename,
              "hf_xet_version": getattr(hf_xet, "__version__", "unknown"),
              "xet_metadata_present_in_hub_api": bool(xet_metadata),
              "xet_file_hash_from_hub_api": xet_file_hash,
              "cold_a": cold_a,
              "warm": warm,
              "cold_b": cold_b,
              "hashes_equal": hashes_equal,
              "warm_speedup": cold_a["elapsed_seconds"]
              / max(warm["elapsed_seconds"], 1e-9),
              "preserved_chunk_cache_speedup": cold_a["elapsed_seconds"]
              / max(cold_b["elapsed_seconds"], 1e-9),
              "preserved_chunk_cache_network_ratio": network_ratio,
              "xet_transport_proven_by_client_logs": endpoint_evidence,
              "chunk_cache_reuse_observed": chunk_cache_reuse_observed,
              "interpretation": (
                  "The client logs prove CAS/range/reconstruction/Xet transport. "
                  "The ordinary Hub cache eliminated the warm transfer. The "
                  "configured Xet chunk-cache directory remained empty and "
                  "preserving it did not materially reduce cold re-download "
                  "network bytes for this 9.2 MB object."
              ),
              "scope_boundary": (
                  "Read-only download/cache canary. No authenticated upload, "
                  "server-side deduplication accounting, xorb storage billing, "
                  "or cross-tenant savings measurement. The current Hub API did "
                  "not surface xet_file_data for this object even though the Xet "
                  "client logs showed CAS reconstruction activity."
              ),
          }
          output.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "hashes_equal": hashes_equal,
                      "xet_transport_proven_by_client_logs": endpoint_evidence,
                      "chunk_cache_reuse_observed": chunk_cache_reuse_observed,
                      "warm_speedup": result["warm_speedup"],
                      "preserved_chunk_cache_speedup": result[
                          "preserved_chunk_cache_speedup"
                      ],
                      "preserved_chunk_cache_network_ratio": network_ratio,
                  },
                  indent=2,
              )
          )
          if not hashes_equal:
              raise SystemExit("payload hashes differed")
          if not endpoint_evidence:
              raise SystemExit("Xet/CAS transport was not visible in client logs")
          PY

      - name: Record resolved environment
        if: always()
        run: |
          mkdir -p openmediagraph-results
          python -m pip freeze > openmediagraph-results/RESOLVED_ENVIRONMENT.txt
          uname -a > openmediagraph-results/RUNNER_KERNEL.txt
          (nvidia-smi || true) > openmediagraph-results/NVIDIA_SMI.txt 2>&1

      - name: Verify artifact contains no source media
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("openmediagraph-results")
          prohibited = {
              ".wav", ".flac", ".mp3", ".ogg", ".m4a", ".mp4", ".mov",
              ".npy", ".npz", ".pt", ".pth", ".h5", ".hdf5", ".sqlite3",
          }
          violations = [
              str(path) for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in prohibited
          ]
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          if violations:
              raise SystemExit(f"prohibited payloads in artifact: {violations}")
          if total > 25 * 1024 * 1024:
              raise SystemExit(f"research artifact unexpectedly large: {total} bytes")
          print(f"artifact safety check passed: {total} bytes")
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmediagraph-next-five-research
          path: openmediagraph-results/
          if-no-files-found: error
          retention-days: 14

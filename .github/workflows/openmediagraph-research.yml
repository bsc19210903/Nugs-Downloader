name: OpenMediaGraph read-only research

on:
  pull_request:
    paths:
      - "research/openmediagraph_next5/**"
      - ".github/workflows/openmediagraph-research.yml"

permissions:
  contents: read

concurrency:
  group: openmediagraph-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  next-five-canary:
    name: Execute five read-only research steps
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=2.1,<3" \
            "scipy>=1.14,<2" \
            "psutil>=6,<8" \
            "huggingface_hub>=0.36,<2" \
            "hf_xet>=1.1,<2"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "torch==2.7.1" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Run focused harness tests
        run: python research/openmediagraph_next5/run_bundle.py --self-test

      - name: Execute five research steps
        run: |
          python research/openmediagraph_next5/run_bundle.py \
            --work "${RUNNER_TEMP}/openmediagraph-work" \
            --output "openmediagraph-results"

      - name: Record resolved environment
        if: always()
        run: |
          mkdir -p openmediagraph-results
          python -m pip freeze > openmediagraph-results/RESOLVED_ENVIRONMENT.txt
          uname -a > openmediagraph-results/RUNNER_KERNEL.txt
          (nvidia-smi || true) > openmediagraph-results/NVIDIA_SMI.txt 2>&1

      - name: Verify artifact contains no source media
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("openmediagraph-results")
          prohibited = {
              ".wav", ".flac", ".mp3", ".ogg", ".m4a", ".mp4", ".mov",
              ".npy", ".npz", ".pt", ".pth", ".h5", ".hdf5", ".sqlite3",
          }
          violations = [
              str(path) for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() in prohibited
          ]
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          if violations:
              raise SystemExit(f"prohibited payloads in artifact: {violations}")
          if total > 25 * 1024 * 1024:
              raise SystemExit(f"research artifact unexpectedly large: {total} bytes")
          print(f"artifact safety check passed: {total} bytes")
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmediagraph-next-five-research
          path: openmediagraph-results/
          if-no-files-found: error
          retention-days: 14

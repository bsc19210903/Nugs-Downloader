name: Build global fisheries permit and high-seas supplement

on:
  push:
    branches:
      - codex/global-fisheries-static-artifact-20260828
    paths:
      - tools/global_deep/**
      - .github/workflows/global-fisheries-deep-supplement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pyshp shapely pyproj pypdf
      - name: Restore and verify builder
        run: |
          set -euo pipefail
          base64 --decode tools/global_deep/build_deep_supplement.py.gz.b64 | gzip -dc > /tmp/build_deep_supplement.py
          echo 'e45a66a49772cfe0ef964647d0aaebea98fedfb4b1d70ce9a571f438a578667f  /tmp/build_deep_supplement.py' | sha256sum -c --strict
          python -m py_compile /tmp/build_deep_supplement.py
      - name: Acquire permits, route lists and high-seas geometry
        run: python /tmp/build_deep_supplement.py --out dist-deep
      - name: Validate static supplement
        run: |
          python - <<'PY'
          import json, pathlib
          v=json.loads(pathlib.Path('dist-deep/global_deep_supplement_validation.json').read_text())
          assert v['xml_parse_ok'] and v['networklinks_zero'] and v['coordinates_valid'] and v['placemarks'] > 0
          print(json.dumps(v,indent=2))
          PY
      - name: Upload compact supplement
        uses: actions/upload-artifact@v4
        with:
          name: global-fisheries-deep-supplement
          path: |
            dist-deep/global_deep_supplement.kmz
            dist-deep/global_deep_supplement_ledger.json
            dist-deep/global_deep_supplement_ledger.csv
            dist-deep/global_deep_supplement_validation.json
            dist-deep/global_deep_supplement_summary.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

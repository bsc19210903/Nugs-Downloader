name: Split full global infrastructure v2 artifacts

on:
  push:
    branches:
      - build/global-infrastructure-v2-20260828
    paths:
      - ".github/workflows/split-global-infrastructure-v2-full.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download successful full v2 build
        run: |
          set -euo pipefail
          mkdir -p input-full
          gh run download 33186337458 \
            --repo "$GITHUB_REPOSITORY" \
            --name global-fiber-electric-v2-2026-08-28 \
            --dir input-full
          unzip -t input-full/global_fiber_electric_v2_broad_research_2026-08-28.kmz
          unzip -t input-full/global_fiber_electric_v2_open_government_2026-08-28.kmz
          find input-full -maxdepth 1 -type f -printf '%12s  %f\n' | sort -n
      - name: Upload full broad-research KMZ
        uses: actions/upload-artifact@v4
        with:
          name: global-fiber-electric-v2-full-broad-map-2026-08-28
          path: input-full/global_fiber_electric_v2_broad_research_2026-08-28.kmz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload full open-government KMZ
        uses: actions/upload-artifact@v4
        with:
          name: global-fiber-electric-v2-full-open-map-2026-08-28
          path: input-full/global_fiber_electric_v2_open_government_2026-08-28.kmz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload full manifests
        uses: actions/upload-artifact@v4
        with:
          name: global-fiber-electric-v2-full-manifests-2026-08-28
          path: |
            input-full/*.csv
            input-full/*.json
            input-full/*.md
            input-full/SHA256SUMS_global_fiber_electric_v2.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

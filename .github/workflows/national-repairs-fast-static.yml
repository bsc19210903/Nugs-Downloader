name: Build national permit and restriction repairs

on:
  push:
    branches:
      - codex/global-fisheries-static-artifact-20260828
    paths:
      - .github/workflows/national-repairs-fast-static.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 lxml pyshp shapely pyproj pypdf
      - name: Restore builder and acquire national repairs
        run: |
          base64 --decode tools/global_deep/build_deep_supplement.py.gz.b64 | gzip -dc > /tmp/deep.py
          python - <<'PY'
          import importlib.util,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('deep','/tmp/deep.py');m=importlib.util.module_from_spec(spec);sys.modules['deep']=m;spec.loader.exec_module(m)
          b=m.Builder(Path('dist-national'))
          # Australia EPBC cable-related environmental referral footprints.
          epbc='https://services.arcgis.com/QICyR7WYn5FHwT6S/arcgis/rest/services/EPBC_Referrals/FeatureServer/0'
          l=m.Ledger('au_epbc_cable_referrals','Australia EPBC Cable-Related Referral Footprints','Asia / Pacific','Australia','Australian Government DCCEEW','Environmental referral / permit footprint',epbc,route_version='environmental referral footprint',coverage='project location/footprint, not an as-laid route')
          where="UPPER(PROJECT_NAME) LIKE '%CABLE%' OR UPPER(PROJECT_NAME) LIKE '%SUBMARINE%' OR UPPER(PROJECT_TITLE) LIKE '%CABLE%' OR UPPER(PROJECT_TITLE) LIKE '%SUBMARINE%'"
          b.add(l,lambda:b.arcgis(l,epbc,'permit-footprint',where=where,batch=50))
          # New Zealand statutory fisheries and cable/pipeline protection layers.
          nzbase='https://maps.mpi.govt.nz/wss/service/arcgis1/guest/MARINE/MARINE_Restrictions_CommercialFishingRegulations/MapServer'
          for lid,title,style in [(1,'All Commercial Fishing Prohibitions','fishing-closure'),(4,'Benthic Protection Areas','marine-protected'),(5,'Closed Seamount Areas','fishing-closure'),(16,'Submarine Cables and Pipelines Protection Areas','cable-protection'),(17,'Territorial-Sea Trawling Prohibited','fishing-closure'),(18,'Trawl Area Restrictions','fishing-closure')]:
            url=f'{nzbase}/{lid}'; l=m.Ledger(f'nz_mpi_{lid}',f'New Zealand — {title}','Asia / Pacific','New Zealand','New Zealand Ministry for Primary Industries','Statutory marine restriction',url,route_version='current statutory GIS layer',coverage=title); b.add(l,lambda l=l,url=url,style=style:b.arcgis(l,url,style,batch=50))
          url='https://maps.mpi.govt.nz/wss/service/arcgis1/guest/MARINE/MARINE_Restrictions_CommercialFishingRegulations_Polyline/MapServer/25'; l=m.Ledger('nz_mpi_25','New Zealand — Commercial Trawl Restriction Lines','Asia / Pacific','New Zealand','New Zealand Ministry for Primary Industries','Statutory marine restriction line',url,route_version='current statutory GIS layer',coverage='trawl-restriction lines'); b.add(l,lambda:b.arcgis(l,url,'fishing-closure',batch=50))
          # Chile fisheries-management areas and modifications.
          for sid,title,url,rv,style in [
            ('cl_amerb_0','Chile Decreed AMERB Areas','https://geoportal.subpesca.cl/server/rest/services/IDE_PUBLICO/SRMPUB_AMERB/MapServer/0','decreed/current','fishing-closure'),
            ('cl_amerb_1','Chile Requested AMERB Areas','https://geoportal.subpesca.cl/server/rest/services/IDE_PUBLICO/SRMPUB_AMERB/MapServer/1','requested/proposed','permit-footprint'),
            ('cl_amerb_2','Chile Rejected AMERB Applications','https://geoportal.subpesca.cl/server/rest/services/IDE_PUBLICO/SRMPUB_AMERB/MapServer/2','rejected/historic','permit-footprint'),
            ('cl_amerb_mod','Chile AMERB Expansion and Reduction Records','https://geoportal.subpesca.cl/server/rest/services/IDE_PUBLICO/SRMPUB_AMERB_AMPLIACIONES_REDUCCIONES/MapServer/0','application/approved modification','permit-footprint'),
            ('cl_amerb_aqua','Chile Authorized Aquaculture Within AMERB','https://geoportal.subpesca.cl/server/rest/services/IDE_PUBLICO/SRMPUB_ACUIAMERB/MapServer/0','authorized/current','marine-protected'),
          ]:
            l=m.Ledger(sid,title,'South America','Chile','Chile SUBPESCA','Fisheries-management area',url,route_version=rv,coverage='national coastal fisheries management'); b.add(l,lambda l=l,url=url,style=style:b.arcgis(l,url,style,batch=50))
          # South Africa official wellhead layers.
          for lid,title in [(2,'Petroleum Exploitation Wellheads'),(3,'Petroleum Exploration Wellheads')]:
            url=f'https://screening.environment.gov.za/server/rest/services/OC_MSP/3_11_NDIR_Minerals/MapServer/{lid}'; l=m.Ledger(f'za_wells_{lid}',f'South Africa — {title}','Africa','South Africa','South Africa DFFE','Offshore petroleum wellheads',url,route_version='official planning/current',coverage=title); b.add(l,lambda l=l,url=url:b.arcgis(l,url,'point',batch=50))
          b.finish()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: national-repairs-fast-static-v2
          path: |
            dist-national/global_deep_supplement.kmz
            dist-national/global_deep_supplement_ledger.json
            dist-national/global_deep_supplement_ledger.csv
            dist-national/global_deep_supplement_validation.json
            dist-national/global_deep_supplement_summary.txt
          retention-days: 3
          compression-level: 0
